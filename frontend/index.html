<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS - AI Brain Interface</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #050b14;
      color: #00f3ff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #00f3ff44;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    header h1 {
      letter-spacing: 4px;
      font-size: 1.8rem;
      text-shadow: 0 0 10px #00f3ff;
    }

    #chat-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 8px;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .user {
      align-self: flex-end;
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid #00f3ff88;
      color: #e0ffff;
      border-bottom-right-radius: 0;
    }

    .jarvis {
      align-self: flex-start;
      background: rgba(0, 100, 150, 0.2);
      border: 1px solid #0088cc;
      color: #7df9ff;
      border-bottom-left-radius: 0;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.15);
    }

    #input-container {
      display: flex;
      padding: 20px;
      border-top: 1px solid #00f3ff44;
      background-color: #03070d;
    }

    input[type="text"] {
      flex: 1;
      background: #091424;
      border: 1px solid #00f3ff66;
      color: #00f3ff;
      padding: 12px;
      border-radius: 4px;
      outline: none;
      font-size: 1rem;
    }

    input[type="text"]:focus {
      border-color: #00f3ff;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
    }

    button {
      background: #00f3ff;
      color: #050b14;
      border: none;
      padding: 12px 24px;
      margin-left: 10px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #80f9ff;
      box-shadow: 0 0 12px #00f3ff;
    }
  </style>
</head>
<body>

  <header>
    <h1>J.A.R.V.I.S. INTERFACE</h1>
  </header>

  <div id="chat-container">
    <div class="message jarvis">
      <strong>JARVIS:</strong> Systems operational, boss. How can I assist you today?
    </div>
  </div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="Enter command or message..." autocomplete="off" />
    <button id="send-btn">SEND</button>
  </div>

  <!-- Load Gemini SDK via ES Modules -->
  <script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    // ⚠️ Insert your Gemini API Key below
    const API_KEY = "AQ.Ab8RN6LZSxPqbZdJaPQ_33cpfwnVM0jyPh5oHYgMUZt7Nwy_Qw";

    // Initialize Gemini AI with System Instructions to act like Jarvis
    const genAI = new GoogleGenerativeAI(API_KEY);
    const model = genAI.getGenerativeModel({
      model: "gemini-2.5-flash",
      systemInstruction: "You are JARVIS, an advanced AI assistant. Respond concisely, intelligently, and politely with a subtle futuristic and helpful persona."
    });

    const chatContainer = document.getElementById("chat-container");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage("User", text, "user");
      userInput.value = "";

      const loadingMsg = appendMessage("JARVIS", "Processing query...", "jarvis");

      try {
        const result = await model.generateContent(text);
        const responseText = await result.response.text();
        loadingMsg.innerHTML = `<strong>JARVIS:</strong> ${responseText}`;
      } catch (error) {
        console.error("API Error:", error);
        loadingMsg.innerHTML = `<strong>JARVIS:</strong> Error connecting to core system. Details: ${error.message}`;
      }
    }

    function appendMessage(sender, text, className) {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("message", className);
      msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    sendBtn.addEventListener("click", handleSend);
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleSend();
    });
  </script>
</body>
</html>
